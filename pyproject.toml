[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-dt-nn"
# NOTE: 0.1.0 was already uploaded to TestPyPI under the old (MIT) metadata.
# You must bump this before your next upload -- PyPI/TestPyPI reject re-uploading
# an existing version number even if the contents changed.
version = "0.1.3"
description = "A hybrid decision tree + neural network regressor implemented with scikit-learn and TensorFlow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Nishith"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "tensorflow>=2.16.1",
  "optuna>=3.3.0",
  "joblib>=1.3.0",
  "h5py>=3.9.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]